<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Watchlist - CineMagic</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .remove-btn {
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(0,0,0,0.8);
            border: 1px solid var(--text-muted);
            color: white;
            border-radius: 50%;
            width: 30px; height: 30px;
            cursor: pointer;
            z-index: 20;
        }
        .remove-btn:hover { background: #e50914; border-color: #e50914; }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">CineMagic</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="profile.html">Profile</a></li>
            </ul>
        </div>
    </nav>

    <div class="app-container" style="padding-top: 100px; min-height: 80vh;">
        <h1 class="section-title" style="font-size:2.5rem;">My Watchlist</h1>
        <div class="grid-layout" id="watchlistGrid">
            <!-- Injected via JS -->
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let currentUser = null;

        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            currentUser = user;
            loadWatchlist();
        });

        async function loadWatchlist() {
            if (!window.db || !currentUser) return;
            const container = document.getElementById('watchlistGrid');
            container.innerHTML = "<p>Loading your watchlist...</p>";

            const doc = await db.collection("users").doc(currentUser.uid).get();
            if (doc.exists) {
                const list = doc.data().watchlist || [];
                if (list.length === 0) {
                    container.innerHTML = "<p style='color:var(--text-muted);'>No items in your watchlist.</p>";
                    return;
                }

                let html = "";
                for (let i = list.length - 1; i >= 0; i--) {
                    const item = list[i];
                    const type = typeof item === 'string' ? item.split('_')[0] : 'movie';
                    const id = typeof item === 'string' ? item.split('_')[1] : item;
                    const typeIdStr = typeof item === 'string' ? item : `movie_${item}`;

                    try {
                        const m = await window.api.getMovieDetails(id, type);
                        if(m && m.poster_path) {
                            const poster = `${window.api.IMG_URL}${m.poster_path}`;
                            const title = m.title || m.name;
                            html += `
                                <div class="movie-card" id="card_${typeIdStr}" style="cursor:default;">
                                    <button class="remove-btn" onclick="removeFromWatchlist('${typeIdStr}')" title="Remove"><i class="fas fa-times"></i></button>
                                    <img src="${poster}" alt="${title}" onclick="window.open('movie.html?id=${id}&type=${type}', '_blank')" style="cursor:pointer;">
                                    <div class="movie-overlay" onclick="window.open('movie.html?id=${id}&type=${type}', '_blank')" style="cursor:pointer;">
                                        <h4>${title}</h4>
                                    </div>
                                </div>
                            `;
                        }
                    } catch(e) {}
                }
                container.innerHTML = html;
            }
        }

        async function removeFromWatchlist(typeIdStr) {
            if(!window.db || !currentUser) return;
            
            // To handle old numerical IDs if present
            const isNumeric = !isNaN(typeIdStr) && !typeIdStr.includes('_');
            const targetVal = isNumeric ? Number(typeIdStr) : typeIdStr;

            try {
                await db.collection("users").doc(currentUser.uid).update({
                    watchlist: firebase.firestore.FieldValue.arrayRemove(targetVal)
                });
                const card = document.getElementById(`card_${typeIdStr}`);
                if(card) {
                    card.style.display = 'none';
                }
            } catch(e) {
                console.error("Failed to remove item", e);
            }
        }
    </script>
</body>
</html>
