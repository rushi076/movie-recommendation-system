<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CineMagic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Sign In</h2>
            <div class="auth-error" id="errorMsg"></div>
            <form class="auth-form" id="loginForm">
                <input type="email" id="email" placeholder="Email or phone number" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit" id="submitBtn">Sign In</button>
            </form>
            <div class="auth-bottom">
                <p>New to CineMagic? <a href="register.html">Sign up now.</a></p>
                <p style="font-size: 0.8rem; margin-top: 15px;">This page is protected by Google reCAPTCHA to ensure you're not a bot.</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.innerText = "Signing in...";
            btn.disabled = true;
            errorMsg.innerText = "";
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await window.loginUser(email, password);
            } catch (err) {
                errorMsg.innerText = err.message;
                btn.innerText = "Sign In";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
