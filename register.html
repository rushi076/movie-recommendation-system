<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CineMagic</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <h2>Sign Up</h2>
            <div class="auth-error" id="errorMsg"></div>
            <form class="auth-form" id="registerForm">
                <input type="text" id="username" placeholder="Name" required>
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password (min 6 characters)" required minlength="6">
                <button type="submit" id="submitBtn">Sign Up</button>
            </form>
            <div class="auth-bottom">
                <p>Already have an account? <a href="login.html">Sign in now.</a></p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (v9 Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            btn.innerText = "Signing up...";
            btn.disabled = true;
            errorMsg.innerText = "";
            
            const name = document.getElementById('username').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                await window.registerUser(email, password, name);
            } catch (err) {
                errorMsg.innerText = err.message;
                btn.innerText = "Sign Up";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
