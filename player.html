<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMagic Player</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            /* Hide scrollbars in player mode */
            font-family: 'Inter', sans-serif;
            color: white;
        }

        .player-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        /* Netflix-style Header overlaid on video */
        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 20px 4%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.8) 0%, transparent 100%);
            display: flex;
            align-items: center;
            z-index: 100;
            transition: opacity 0.3s;
        }

        .back-btn {
            background: none;
            border: none;
            color: white;
            font-size: 1.5rem;
            cursor: pointer;
            margin-right: 20px;
            transition: transform 0.2s;
        }

        .back-btn:hover {
            transform: scale(1.1);
        }

        .video-title {
            font-size: 1.2rem;
            font-weight: 600;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        .video-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-left: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }

        /* Iframe */
        .stream-frame {
            width: 100%;
            height: 100%;
            border: none;
            z-index: 10;
        }

        /* Loader */
        .loader-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 5;
            /* Behind iframe so it hides when iframe loads opaque naturally, but iframe might take time, so we hide manually */
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(229, 9, 20, 0.3);
            border-top: 4px solid var(--accent-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Server Selector Stylings */
        .server-container {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .server-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 600;
        }

        .server-select {
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        .server-select:hover {
            border-color: var(--accent-color);
        }

        .server-select option {
            background: #141414;
            color: white;
        }

        .status-msg {
            position: absolute;
            bottom: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: var(--text-secondary);
            font-size: 0.9rem;
            background: rgba(0, 0, 0, 0.5);
            padding: 5px 15px;
            border-radius: 20px;
            display: none;
            z-index: 100;
        }

        .backup-badge {
            position: absolute;
            top: 80px;
            right: 4%;
            background: rgba(229, 9, 20, 0.8);
            color: white;
            padding: 5px 12px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 90;
            display: none;
            animation: slideIn 0.5s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        @keyframes slideIn {
            from {
                transform: translateX(20px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* Rotate & Fullscreen Button */
        .rotate-btn {
            position: absolute;
            bottom: 40px;
            right: 4%;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 24px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            z-index: 1000;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(10px);
            font-weight: 600;
            font-family: inherit;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .rotate-btn:hover {
            background: var(--accent-color);
            border-color: var(--accent-color);
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 6px 20px rgba(229, 9, 20, 0.4);
        }

        .rotate-btn i {
            font-size: 1.1rem;
            transition: transform 0.3s;
        }

        .rotate-btn:hover i {
            transform: rotate(90deg);
        }

        .rotate-btn span {
            font-size: 0.9rem;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .rotate-btn {
                bottom: 30px;
                padding: 10px 20px;
            }
            .rotate-btn span {
                display: none; /* Icon only on small mobile to save space */
            }
            .rotate-btn {
                padding: 12px;
                border-radius: 50%;
            }
        }
    </style>
</head>

<body>

    <div class="player-wrapper">
        <div class="player-header" id="playerHeader">
            <button class="back-btn" onclick="goBack()" title="Back"><i class="fas fa-arrow-left"></i></button>
            <div id="titleContainer">
                <span class="video-title" id="videoTitle">Loading...</span>
                <span class="video-meta" id="videoMeta"></span>
            </div>
            <div class="server-container">
                <span class="server-label">Server</span>
                <select id="serverSelector" class="server-select"
                    onchange="window.streamManager.switchToProvider(parseInt(this.value))">
                    <option value="0">▶ VidSrc Server 1</option>
                    <option value="1">▶ VidSrc Server 2</option>
                    <option value="2">▶ VidSrc Server 3</option>
                    <option value="3">▶ YouTube (Backup)</option>
                </select>
            </div>
        </div>

        <div class="loader-container" id="playerLoader">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: var(--text-muted);">Connecting to Stream...</p>
        </div>

        <div id="streamingStatus" class="status-msg">Source not available. Select another server.</div>
        <div id="backupBadge" class="backup-badge">Playing from YouTube Source</div>

        <iframe id="videoIframe" class="stream-frame" allowfullscreen allow="autoplay; fullscreen"></iframe>

        <button class="rotate-btn" id="rotateBtn" onclick="toggleRotateFullscreen()" title="Rotate & Fullscreen">
            <i class="fas fa-redo"></i>
            <span>Rotate & Fullscreen</span>
        </button>
    </div>

    <script src="js/api.js"></script>
    <script src="js/stream-manager.js"></script>
    <script>
        // Idle detection for header and rotate button
        let idleTimer;
        const playerHeader = document.getElementById('playerHeader');
        const rotateBtn = document.getElementById('rotateBtn');

        function resetIdleTimer() {
            playerHeader.style.opacity = '1';
            rotateBtn.style.opacity = '1';
            rotateBtn.style.pointerEvents = 'auto';
            playerHeader.style.pointerEvents = 'auto';
            
            clearTimeout(idleTimer);
            idleTimer = setTimeout(() => {
                playerHeader.style.opacity = '0';
                rotateBtn.style.opacity = '0';
                rotateBtn.style.pointerEvents = 'none';
                playerHeader.style.pointerEvents = 'none';
            }, 3000); // hide after 3 seconds of no mouse movement
        }

        window.addEventListener('mousemove', resetIdleTimer);
        window.addEventListener('touchstart', resetIdleTimer);
        resetIdleTimer();

        // Param parsing
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const type = params.get('type') || 'movie';
        let season = params.get('season') || 1;
        let episode = params.get('episode') || 1;

        function goBack() {
            if (document.referrer.includes('movie.html')) {
                window.history.back();
            } else {
                // Fallback direct build
                window.location.href = `movie.html?id=${id}&type=${type}`;
            }
        }

        if (!id) {
            alert("No video ID provided.");
            window.location.href = "index.html";
        }

        async function initPlayer() {
            const iframe = document.getElementById('videoIframe');
            const loader = document.getElementById('playerLoader');

            // Initialize Stream Manager
            window.streamManager = new StreamManager({
                id: id,
                type: type,
                season: season,
                episode: episode,
                iframeId: 'videoIframe',
                loaderId: 'playerLoader',
                statusId: 'streamingStatus',
                timeout: 10000
            });

            // Fetch Title for header
            try {
                const details = await window.api.getMovieDetails(id, type);
                if (details) {
                    document.getElementById('videoTitle').innerText = details.title || details.name;
                    if (type === 'tv') {
                        document.getElementById('videoMeta').innerText = `| S${season} E${episode}`;
                    } else if (details.release_date) {
                        document.getElementById('videoMeta').innerText = `(${details.release_date.substring(0, 4)})`;
                    }
                }
            } catch (e) {
                document.getElementById('videoTitle').innerText = "Streaming Video";
            }
        }

        async function toggleRotateFullscreen() {
            const wrapper = document.querySelector('.player-wrapper');
            
            try {
                if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                    // ENTER FULLSCREEN
                    if (wrapper.requestFullscreen) {
                        await wrapper.requestFullscreen();
                    } else if (wrapper.webkitRequestFullscreen) {
                        await wrapper.webkitRequestFullscreen();
                    } else if (wrapper.mozRequestFullScreen) {
                        await wrapper.mozRequestFullScreen();
                    } else if (wrapper.msRequestFullscreen) {
                        await wrapper.msRequestFullscreen();
                    }

                    // LOCK ORIENTATION (Chrome Android / Edge Mobile)
                    if (screen.orientation && screen.orientation.lock) {
                        // Small delay to ensure fullscreen is active
                        setTimeout(async () => {
                            try {
                                await screen.orientation.lock('landscape');
                            } catch (e) {
                                console.log("Orientation lock failed:", e);
                            }
                        }, 200);
                    }
                } else {
                    // EXIT FULLSCREEN
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    } else if (document.mozCancelFullScreen) {
                        await document.mozCancelFullScreen();
                    } else if (document.msExitFullscreen) {
                        await document.msExitFullscreen();
                    }
                }
            } catch (err) {
                console.error("Fullscreen error:", err);
            }
        }

        // Handle Orientation Unlock on Exit
        document.addEventListener('fullscreenchange', handleExit);
        document.addEventListener('webkitfullscreenchange', handleExit);

        function handleExit() {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }

        initPlayer();
    </script>
</body>

</html>
